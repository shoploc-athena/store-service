spring.application.name=store-service

# Connexion à la base : les valeurs après ":" servent en local,
# Docker les remplacera avec des variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/store_db}
spring.datasource.username=${DB_USER:shoploc}
spring.datasource.password=${DB_PASSWORD:shoploc}

# Crée ou met à jour les tables automatiquement (pratique pour le squelette)
spring.jpa.hibernate.ddl-auto=update