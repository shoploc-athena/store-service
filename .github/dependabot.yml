version: 2
updates:
  # Java dependencies (Maven)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used in the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # Base images used in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Java stays on version 21 until the team decides to upgrade
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The Java version is part of the tag (3-eclipse-temurin-21):
      # update this image by hand
      - dependency-name: "maven"
    commit-message:
      prefix: "chore(docker)"